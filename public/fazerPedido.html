<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fazer pedido</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="css/media-queries.css" />
  </head>
  <body>
    <header>
        <img class="logo" src="./img/logo.jpg" alt="logo da hamburgueria" />
        <nav>
          <ul>
            <li>
              <a href="index.html"
                ><i class="fa-solid fa-house-chimney-window"></i
              ></a>
            </li>
            <li><a href="menu.html" target="_blank">Menu</a></li>
            <li><a href="sobreNos.html">Sobre nós</a></li>
            <li><a href="promocao.html">Promoção do dia</a></li>
            <li>
              <a href="fazerPedido.html" class="botao-fazer-pedido"
                >Fazer pedido</a
              >
            </li>
            <li><a href="login.html" id="butao-login">Login</a></li>
          </ul>
        </nav>
    </header>

    <main id="fazer-pedido">
      <div class="fazer-pedido">
        <h1>Resumo da compra</h1>
        <div class="compra">
          <h2>Produtos adicionados</h2>
          <ul id="lista-itens">
            
          </ul>
          <a href="./menu.html" class="botao-add-produto" target="_blank">Adicionar mais produtos</a>
          <output id="total-pedido">Total: R$</output>
          <label for="pag">Forma de pagamento: </label>
          <select name="pag" id="pag">
            <option value="credito">Crédito</option>
            <option value="debito">Débito</option>
          </select>
          <label for="endereco">Endereco:</label>
          <input type="text" id="endereco" required />
          <div class="botao-finalizar-pedido">Finalizar pedido</div>
        </div>
      </div>
    </main>
    <footer>
      <nav class="sobre">
        <img class="logo" src="./img/logo.jpg" alt="logo da hamburgueria" />
        <ul>
          <li>
            <a href=""> <i class="fas fa-burger"></i>Trabalhe conosco </a>
          </li>
          <li>
            <a href=""> <i class="fas fa-phone"></i>Fale conosco </a>
          </li>
        </ul>
      </nav>
      <nav class="social-media">
        <ul>
          <li>
            <a href=""><i class="fab fa-whatsapp"></i></a>
          </li>
          <li>
            <a href=""><i class="fab fa-facebook"></i></a>
          </li>
          <li>
            <a href=""><i class="fab fa-instagram"></i></a>
          </li>
        </ul>
      </nav>
    </footer>
    <script src="./js/logout.js"></script>
    <script src="./js/fazer-pedido.js"></script>
  </body>
</html>
