<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./css/style.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    />
</head>
<body>
    <header>
      <img class="logo" src="./img/logo.jpg" alt="logo da hamburgueria" />
      <nav>
        <ul>
          <li>
            <a href="index.html"
              ><i class="fa-solid fa-house-chimney-window"></i
            ></a>
          </li>
          <li><a href="menu.html" target="_blank">Menu</a></li>
          <li><a href="sobreNos.html">Sobre nós</a></li>
        </ul>
      </nav>
    </header>
    <main id="main-registro">
        <form method="post">
            <h1>Login</h1>

            <div>
                <label for="email-login">Email</label>
                <input type="email" name="email-login" id="email-login" placeholder="Email" required>
            </div>

            <div>
                <label for="senha-login">Senha</label>
                <input type="password" placeholder="Senha" name="senha-login" id="senha-login">
            </div>

            <div id="entrar">
                <button type="submit">Entrar</button>
                <p>Não tem uma conta? <a href="./registro.html">Registre-se aqui</a></p>
            </div>
        </div>
    </main>
    <script type="module" src="./js/login.js"></script>
</body>
</html>
