<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <img class="logo" src="./img/logo.jpg" alt="logo da hamburgueria" />
      <nav>
        <ul>
          <li>
            <a href="index.html"
              ><i class="fa-solid fa-house-chimney-window"></i
            ></a>
          </li>
          <li><a href="menu.html" target="_blank">Menu</a></li>
          <li><a href="sobreNos.html">Sobre nós</a></li>
        </ul>
      </nav>
    </header>
    <main id="main-registro">
      <form method="POST" autocomplete="off" action="/user/create-user">
        <h1>Registro</h1>
        <div>
          <label for="nome">Nome</label>
          <input
            type="text"
            name="nome"
            id="nome"
            placeholder="Nome completo"
            required
          />
        </div>

        <div>
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="exemple@email.com"
          />
        </div>

        <div>
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            required
            placeholder="Senha"
          />
        </div>

        <div>
          <label for="confirmação-senha">Confirmação de senha</label>
          <input
            type="password"
            id="confirmação-senha"
            name="confirmação-senha"
            required
            placeholder="Confirme sua senha"
          />
        </div>

        <div>
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" placeholder="(xx) xxxxx-xxxx" />
        </div>
        <div class="registro">
          <p>
            <input
              type="checkbox"
              name="termos-condicoes"
              id="termos-condicoes"
            />
            <span>Aceito Termos e condições</span>
          </p>
          <div id="infos">
            <p></p>
          </div>
        </div>
        <div class="registro">
          <button type="submit" class="registrar-btn">Registrar</button>
        </div>
      </form>
    </main>

    <script type="module" src="./js/registro.js"></script>
  </body>
</html>
